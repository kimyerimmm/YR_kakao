name: Update Kakao financial data
on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 5 * *" # 매월 5일 22:20 UTC (한국시간 다음날 07:20)
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and analyze
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python main.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update Kakao financial data"
          git push
